<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoto Mini Studio — Rugged</title>
<style>
body{margin:0;background:#171a1d;color:#eee;font-family:Arial,sans-serif;padding:24px}
main{max-width:700px;margin:auto;background:#292e32;border:2px solid #596168;border-radius:16px;padding:24px}
h1{color:#f2a23a;letter-spacing:2px}
h2{font-size:17px;color:#f2a23a}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:7px;font-size:16px}
input{background:#171a1d;color:white;border:1px solid #777}
button{background:#ed9c32;color:#171a1d;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.card{background:#171a1d;padding:14px;border-radius:8px;margin:10px 0}
.small{color:#b8c0c5;font-size:13px}
#status{white-space:pre-wrap;color:#f2a23a}
</style>
</head>
<body>
<main>
<h1>YOTO MINI STUDIO</h1>
<p class="small">RUGGED EDITION / PLAYLIST CONTROL</p>
<div class="card">
<h2>01 — YOTO ACCOUNT LINK</h2>
<label for="client">Your Yoto Client ID</label>
<input id="client" placeholder="Paste your Client ID here">
<button id="connect">CONNECT TO YOTO</button>
<p class="small">Sign in on Yoto's official login page. This app never asks for your Yoto password.</p>
</div>
<div class="card">
<h2>02 — YOUR PLAYLISTS</h2>
<button id="load" disabled>LOAD MY PLAYLISTS</button>
<div id="playlists">Connect your Yoto account to view your playlists.</div>
</div>
<p id="status">SYSTEM READY</p>
</main>
<script>
const $=id=>document.getElementById(id);
const redirectUri=location.origin+location.pathname;
const scopes="family:library:view offline_access";

function randomText(){
  const bytes=crypto.getRandomValues(new Uint8Array(32));
  return btoa(String.fromCharCode(...bytes))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function challenge(verifier){
  const data=new TextEncoder().encode(verifier);
  const hash=await crypto.subtle.digest("SHA-256",data);
  return btoa(String.fromCharCode(...new Uint8Array(hash)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function clientId(){
  return $("client").value.trim() || sessionStorage.getItem("yoto_client_id") || "";
}
$("connect").onclick=async()=>{
  const id=clientId();
  if(!id){$("status").textContent="Enter your Yoto Client ID first.";return;}
  if(!crypto.subtle){$("status").textContent="Secure HTTPS is required. Publish this site first.";return;}
  $("status").textContent="Preparing secure Yoto sign-in...";
  const verifier=randomText();
  const state=randomText();
  sessionStorage.setItem("yoto_client_id",id);
  sessionStorage.setItem("yoto_verifier",verifier);
  sessionStorage.setItem("yoto_state",state);
  const params=new URLSearchParams({
    audience:"https://api.yotoplay.com",
    scope:scopes,
    response_type:"code",
    client_id:id,
    redirect_uri:redirectUri,
    state:state,
    code_challenge:await challenge(verifier),
    code_challenge_method:"S256"
  });
  location.href="https://login.yotoplay.com/authorize?"+params;
};

async function finishLogin(){
  const params=new URLSearchParams(location.search);
  const code=params.get("code");
  if(!code)return;
  const state=params.get("state");
  if(state!==sessionStorage.getItem("yoto_state")){
    $("status").textContent="Sign-in check failed. Please reconnect.";
    return;
  }
  $("status").textContent="Finishing Yoto sign-in...";
  try{
    const response=await fetch("https://login.yotoplay.com/oauth/token",{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({
        grant_type:"authorization_code",
        client_id:sessionStorage.getItem("yoto_client_id"),
        code_verifier:sessionStorage.getItem("yoto_verifier"),
        code:code,
        redirect_uri:redirectUri
      })
    });
    const tokens=await response.json();
    if(!response.ok)throw new Error(tokens.error_description||tokens.error||"Sign-in failed");
    sessionStorage.setItem("yoto_access_token",tokens.access_token);
    if(tokens.refresh_token)sessionStorage.setItem("yoto_refresh_token",tokens.refresh_token);
    history.replaceState({},document.title,redirectUri);
    $("status").textContent="YOTO ACCOUNT CONNECTED!";
    $("load").disabled=false;
    loadPlaylists();
  }catch(e){$("status").textContent="Connection error: "+e.message;}
}
async function loadPlaylists(){
  const token=sessionStorage.getItem("yoto_access_token");
  if(!token){$("status").textContent="Please connect first.";return;}
  $("playlists").textContent="Loading your Yoto playlists...";
  try{
    const response=await fetch("https://api.yotoplay.com/content/mine",{
      headers:{Authorization:"Bearer "+token}
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.message||"Could not load playlists");
    const cards=data.cards||[];
    $("playlists").innerHTML="";
    if(!cards.length){$("playlists").textContent="No playlists were returned by Yoto.";}
    cards.forEach(card=>{
      const item=document.createElement("div");
      item.className="card";
      const name=document.createElement("strong");
      name.textContent=card.title||"Untitled playlist";
      item.appendChild(name);
      if(card.title==="JAXON!"){
        const tag=document.createElement("p");
        tag.textContent="★ YOUR JAXON! PLAYLIST";
        tag.style.color="#f2a23a";
        item.appendChild(tag);
      }
      $("playlists").appendChild(item);
    });
    $("status").textContent="Loaded "+cards.length+" Yoto items.";
  }catch(e){$("playlists").textContent="Could not load: "+e.message;}
}
$("load").onclick=loadPlaylists;
if(location.search.includes("code="))finishLogin();
</script>
</body>
</html>
